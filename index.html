<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HedgeFoundry</title>
    <meta
      name="description"
      content="Factorio, but you run a hedge fund: mine market data, process signals, defend against finance bros, hire 250 and take the fund public."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ticker"></div>
    <div id="title-chip">HEDGEFOUNDRY v0.1.0</div>
    <div id="feed-chip" class="chip connecting">CONNECTING</div>
    <div id="speed-chip" class="chip">1×</div>
    <div id="status-chip" class="chip"></div>
    <div id="error-chip"></div>
    <div id="minimap"></div>
    <div id="hud"></div>
    <div id="panel"></div>
    <div id="research"></div>
    <div id="buildbar"></div>
    <div id="tutorial"></div>
    <div id="help"></div>
    <div id="toast"></div>
    <div id="overlay">
      <div id="overlay-box">
        <div id="overlay-title"></div>
        <div id="overlay-stats"></div>
        <div id="overlay-sub"></div>
        <button id="overlay-btn">NEW GAME</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
